<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="تصویر موجود نیست">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f6"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="320" height="180" fill="url(#bg)"/>
  <rect width="320" height="180" fill="url(#grid)" opacity="0.5"/>

  <g transform="translate(160, 82)">
    <circle cx="0" cy="0" r="38" fill="url(#icon)" opacity="0.18"/>
    <circle cx="0" cy="0" r="28" fill="url(#icon)" opacity="0.28"/>
    <g fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- بدنه دسته بازی -->
      <path d="M-16,-6 Q-22,-6 -22,0 L-22,4 Q-22,10 -16,10 L-8,10 Q-4,10 -2,7 L2,7 Q4,10 8,10 L16,10 Q22,10 22,4 L22,0 Q22,-6 16,-6 Z" />
      <!-- دکمه‌های D-pad -->
      <line x1="-13" y1="2" x2="-13" y2="4"/>
      <line x1="-14" y1="3" x2="-12" y2="3"/>
      <!-- دکمه‌های راست -->
      <circle cx="13" cy="3" r="1.2" fill="#6366f1"/>
    </g>
  </g>

  <text
    x="160"
    y="146"
    text-anchor="middle"
    font-family="Vazirmatn, system-ui, sans-serif"
    font-size="11"
    font-weight="500"
    fill="#94a3b8"
  >
    تصویری برای نمایش نیست
  </text>
</svg>
